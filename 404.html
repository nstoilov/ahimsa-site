<!DOCTYPE html>
<html>
  <head>
    <title>Ahimsa</title>
    <meta name="description" content="Медитации за тяло и ум" />
    <!-- Open Graph for rich link previews in Messages / social apps -->
    <meta property="og:title" content="Ahimsa – Медитации" />
    <meta property="og:description" content="Отвори в приложението Ahimsa" />
    <meta property="og:url" content="https://ahimsaapp.com" />
    <script>
      // Universal Links open the app at the OS level before any web page
      // loads, so reaching 404.html means the app isn't installed (or the
      // link was opened in-browser). Forward to the store-redirect page.
      // We deliberately do NOT attempt the ahimsa:// custom scheme here:
      // on devices without the app, navigating to an unregistered scheme
      // destroys this page's JS context (Safari shows a blank "cannot
      // open" page) and the fallback never runs.
      window.location.replace("/mobile-redirect.html");
    </script>
  </head>
  <body>
    <p>Отваряне на Ahimsa…</p>
  </body>
</html>
